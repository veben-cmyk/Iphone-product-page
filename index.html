<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iphone-product-page</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <nav class="flex items-center justify-between p-6 bg-gray-800 text-white">
        <img src="images/logo.png" alt="Apple Logo" width="50" height="50">
        <ul class="flex space-x-4">
            <li class="hover:text-gray-300"><a href="#">Home</a></li>
            <li class="hover:text-gray-300"><a href="#">Products</a></li>
            <li class="hover:text-gray-300"><a href="#">About</a></li>
            <li class="hover:text-gray-300"><a href="#">Contact</a></li>
        </ul>
    </nav>

    <main class="text-center p-8">
        <h1 class="text-4xl font-bold mb-4"> 
            Vos idées. Sa magie. <br> <span class="text-gray-400">Du génie !</span>
        </h1>
        <p class="">
            Découvrez l'iPhone 14 Pro : puce A16 Bionic, appareil photo 48 Mpx et écran Super Retina XDR toujours actif. Choisissez votre coloris préféré ci-dessous.
        </p>
    </main>

    <button class="bg-gray-800 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg items-center mx-auto block">
        VOIR LE PRODUIT 
    </button>

    <img src="images/Iphone-01.png" alt="" class="mx-auto mt-8 w-1/2 md:w-1/3 md:mt-8">

    <div class="flex justify-center space-x-4 mt-8">
        <img src="images/Iphone-01.png" alt="" class="w-20 md:w-20 hover:-translate-y-2 transition-transform duration-300">
        <img src="images/Iphone-02.png" alt="" class="w-20 md:w-20 hover:-translate-y-2 transition-transform duration-300">
        <img src="images/Iphone-03.png" alt="" class="w-20 md:w-20 hover:-translate-y-2 transition-transform duration-300">
    </div>

</body>
</html>
